<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unblocked Games</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #111827;
      --panel: #172033;
      --panel-2: #1e293b;
      --primary: #34d399;
      --primary-2: #10b981;
      --danger: #f87171;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --line: #334155;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px 12px 40px;
    }

    .app {
      width: min(100%, 980px);
    }

    .topbar {
      text-align: center;
      margin-bottom: 22px;
    }

    .title {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: 1px;
    }

    .title span {
      color: var(--primary);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
    }

    button.active {
      background: rgba(52, 211, 153, 0.15);
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.3);
    }

    .panel {
      background: rgba(23, 32, 51, 0.95);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .hud .score {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--gold);
    }

    canvas {
      width: 100%;
      max-width: 520px;
      display: block;
      margin: 0 auto;
      background: #09111d;
      border: 1px solid var(--line);
      border-radius: 18px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .actions .primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #062413;
      font-weight: bold;
    }

    .status {
      text-align: center;
      margin-top: 14px;
      color: var(--muted);
      min-height: 24px;
    }

    @media (max-width: 560px) {
      body { padding: 18px 10px 30px; }
      .panel { padding: 12px; }
      .selector { gap: 8px; }
      button { padding: 9px 13px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="title">Unblocked <span>Games</span></h1>
      <p class="subtitle">Quick browser games with no downloads</p>
    </header>

    <div class="selector" aria-label="Game selector">
      <button class="active" data-game="snake">🐍 Snake</button>
      <button data-game="memory">🧠 Memory Match</button>
    </div>

    <section class="panel">
      <div class="hud">
        <div>Game: <strong id="gameName">Snake</strong></div>
        <div class="score">Score: <span id="score">0</span></div>
      </div>

      <canvas id="gameCanvas" width="480" height="480" aria-label="Game board"></canvas>

      <div class="actions">
        <button id="startBtn" class="primary">Start</button>
        <button id="pauseBtn">Pause</button>
      </div>

      <div class="status" id="statusText">Use arrow keys or WASD to move.</div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameNameEl = document.getElementById('gameName');
    const statusEl = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const gameButtons = [...document.querySelectorAll('[data-game]')];

    const state = {
      currentGame: 'snake',
      started: false,
      paused: false,
      score: 0,
      snake: [],
      direction: { x: 1, y: 0 },
      nextDirection: { x: 1, y: 0 },
      food: { x: 10, y: 10 },
      tick: null,
      memory: {
        cards: [],
        flipped: [],
        matched: [],
        locked: false,
        firstPick: null,
        secondPick: null,
        emojis: ['🍒', '🍋', '🍉', '🍇', '🍊', '🍓']
      }
    };

    function randomCell() {
      return Math.floor(Math.random() * 15);
    }

    function resetSnake() {
      clearInterval(state.tick);
      state.started = false;
      state.paused = false;
      state.score = 0;
      state.snake = [
        { x: 6, y: 7 },
        { x: 5, y: 7 },
        { x: 4, y: 7 }
      ];
      state.direction = { x: 1, y: 0 };
      state.nextDirection = { x: 1, y: 0 };
      placeFood();
      scoreEl.textContent = state.score;
      draw();
    }

    function placeFood() {
      do {
        state.food = { x: randomCell(), y: randomCell() };
      } while (state.snake.some(seg => seg.x === state.food.x && seg.y === state.food.y));
    }

    function stepSnake() {
      if (!state.started || state.paused) return;
      state.direction = state.nextDirection;
      const head = {
        x: state.snake[0].x + state.direction.x,
        y: state.snake[0].y + state.direction.y
      };

      const hitWall = head.x < 0 || head.x >= 15 || head.y < 0 || head.y >= 15;
      const hitSelf = state.snake.some((seg, i) => i < state.snake.length && seg.x === head.x && seg.y === head.y);
      if (hitWall || hitSelf) {
        state.started = false;
        clearInterval(state.tick);
        statusEl.textContent = 'Game over! Press Start to play again.';
        draw();
        return;
      }

      state.snake.unshift(head);
      const ateFood = head.x === state.food.x && head.y === state.food.y;
      if (ateFood) {
        state.score += 10;
        scoreEl.textContent = state.score;
        placeFood();
      } else {
        state.snake.pop();
      }

      draw();
    }

    function drawSnake() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#09111d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < 15; x++) {
        for (let y = 0; y < 15; y++) {
          ctx.strokeStyle = '#1e293b';
          ctx.strokeRect(x * 32, y * 32, 32, 32);
        }
      }

      ctx.fillStyle = '#34d399';
      state.food && ctx.fillRect(state.food.x * 32 + 6, state.food.y * 32 + 6, 20, 20);

      state.snake.forEach((seg, index) => {
        ctx.fillStyle = index === 0 ? '#a7f3d0' : '#10b981';
        ctx.fillRect(seg.x * 32 + 3, seg.y * 32 + 3, 26, 26);
      });
    }

    function resetMemory() {
      clearInterval(state.tick);
      state.started = false;
      state.paused = false;
      state.score = 0;
      scoreEl.textContent = state.score;

      const deck = [...state.memory.emojis, ...state.memory.emojis].sort(() => Math.random() - 0.5);
      state.memory.cards = deck.map((emoji, index) => ({ emoji, id: index, matched: false }));
      state.memory.flipped = [];
      state.memory.matched = [];
      state.memory.locked = false;
      state.memory.firstPick = null;
      state.memory.secondPick = null;
      statusEl.textContent = 'Pick two cards to match them.';
      draw();
    }

    function drawMemory() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#09111d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cols = 4;
      const size = 86;
      const margin = 16;
      const offsetX = 52;
      const offsetY = 52;

      state.memory.cards.forEach((card, index) => {
        const col = index % cols;
        const row = Math.floor(index / cols);
        const x = offsetX + col * (size + margin);
        const y = offsetY + row * (size + margin);

        const isFaceUp = state.memory.flipped.includes(index) || card.matched;

        ctx.strokeStyle = '#334155';
        ctx.fillStyle = isFaceUp ? '#1e293b' : '#0f172a';
        ctx.fillRect(x, y, size, size);
        ctx.strokeRect(x, y, size, size);

        if (isFaceUp) {
          ctx.fillStyle = card.matched ? '#34d399' : '#f8fafc';
          ctx.font = 'bold 42px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(card.emoji, x + size / 2, y + size / 2 + 4);
        } else {
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 42px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('?', x + size / 2, y + size / 2 + 4);
        }
      });
    }

    function checkMemoryMatch() {
      const [a, b] = state.memory.flipped;
      if (a === undefined || b === undefined) return;

      const first = state.memory.cards[a];
      const second = state.memory.cards[b];
      if (first.emoji === second.emoji) {
        first.matched = true;
        second.matched = true;
        state.score += 25;
        scoreEl.textContent = state.score;
        state.memory.matched.push(a, b);
        state.memory.flipped = [];
        state.memory.locked = false;
        statusEl.textContent = 'Nice match!';
        if (state.memory.cards.every(card => card.matched)) {
          state.started = false;
          statusEl.textContent = 'You won! Press Start to play again.';
        }
      } else {
        state.memory.locked = true;
        statusEl.textContent = 'Not a match. Try again.';
        setTimeout(() => {
          state.memory.flipped = [];
          state.memory.locked = false;
          draw();
        }, 700);
      }
      state.memory.firstPick = null;
      state.memory.secondPick = null;
      draw();
    }

    function draw() {
      if (state.currentGame === 'snake') drawSnake();
      else drawMemory();
    }

    function startGame() {
      if (state.currentGame === 'snake') {
        resetSnake();
        state.started = true;
        state.paused = false;
        statusEl.textContent = 'Game running. Eat the green food.';
        clearInterval(state.tick);
        state.tick = setInterval(stepSnake, 120);
      } else {
        resetMemory();
        state.started = true;
        state.paused = false;
        statusEl.textContent = 'Game running. Match all the cards.';
      }
    }

    function togglePause() {
      if (!state.started) return;
      state.paused = !state.paused;
      if (state.currentGame === 'snake') {
        if (state.paused) {
          clearInterval(state.tick);
          statusEl.textContent = 'Paused. Press resume to continue.';
          draw();
        } else {
          statusEl.textContent = 'Game running. Eat the green food.';
          state.tick = setInterval(stepSnake, 120);
        }
      } else {
        if (state.paused) {
          statusEl.textContent = 'Paused. Press resume to continue.';
        } else {
          statusEl.textContent = 'Game running. Match all the cards.';
        }
      }
      pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
      draw();
    }

    function setGame(gameName) {
      state.currentGame = gameName;
      gameButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.game === gameName);
      });
      gameNameEl.textContent = gameName === 'snake' ? 'Snake' : 'Memory Match';
      clearInterval(state.tick);
      state.started = false;
      state.paused = false;
      pauseBtn.textContent = 'Pause';
      scoreEl.textContent = '0';

      if (gameName === 'snake') {
        resetSnake();
        statusEl.textContent = 'Use arrow keys or WASD to move.';
      } else {
        resetMemory();
      }
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (state.currentGame === 'snake') {
        const mapping = {
          arrowup: { x: 0, y: -1 },
          w: { x: 0, y: -1 },
          arrowdown: { x: 0, y: 1 },
          s: { x: 0, y: 1 },
          arrowleft: { x: -1, y: 0 },
          a: { x: -1, y: 0 },
          arrowright: { x: 1, y: 0 },
          d: { x: 1, y: 0 }
        };

        const next = mapping[key];
        if (next) {
          event.preventDefault();
          if (next.x !== -state.direction.x || next.y !== -state.direction.y) {
            state.nextDirection = next;
          }
        }
      }

      if (event.code === 'Space') {
        event.preventDefault();
        togglePause();
      }
    });

    canvas.addEventListener('pointerdown', (event) => {
      if (state.currentGame !== 'memory') return;
      if (!state.started || state.paused || state.memory.locked) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (event.clientX - rect.left) * scaleX;
      const y = (event.clientY - rect.top) * scaleY;

      const cols = 4;
      const size = 86;
      const margin = 16;
      const offsetX = 52;
      const offsetY = 52;

      for (let i = 0; i < state.memory.cards.length; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cardX = offsetX + col * (size + margin);
        const cardY = offsetY + row * (size + margin);

        if (x >= cardX && x <= cardX + size && y >= cardY && y <= cardY + size) {
          if (state.memory.flipped.includes(i)) return;
          if (state.memory.flipped.length >= 2) return;

          state.memory.flipped.push(i);
          if (state.memory.flipped.length === 2) {
            checkMemoryMatch();
          }
          draw();
          break;
        }
      }
    });

    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    gameButtons.forEach(btn => btn.addEventListener('click', () => setGame(btn.dataset.game)));

    setGame('snake');
  </script>
</body>
</html>
