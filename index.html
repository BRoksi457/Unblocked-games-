<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Browser Arcade</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--light:#202b43;--line:#33415d;--text:#f4f7ff;--muted:#aab6ce;--green:#45e0a1;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px 40px;background:radial-gradient(ellipse at top,#172746,var(--bg) 65%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{width:min(100%,1000px);margin:auto}header{text-align:center;margin:5px 0 22px}h1{font-size:clamp(2.2rem,6vw,4rem);margin:0;letter-spacing:-.04em}h1 span{color:var(--green)}header p{color:var(--muted);margin:8px 0}.label{margin:0 0 9px;color:var(--muted);font-size:.84rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:15px}.games button,.control{font:inherit;color:var(--text);background:var(--light);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer}.games button:hover,.control:hover{border-color:var(--green)}.games button.active{background:#193c3b;border-color:var(--green)}.panel{padding:clamp(12px,3vw,20px);background:#151d31ed;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 55px #0005}.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.title{font-weight:750;font-size:1.1rem}.score{color:var(--gold);font-weight:750}canvas{display:block;width:min(100%,640px);height:auto;aspect-ratio:4/3;margin:auto;background:#080e1a;border:1px solid var(--line);border-radius:13px;touch-action:none}.actions{display:flex;justify-content:center;gap:10px;margin-top:13px}.control{min-width:105px}.control.primary{background:var(--green);border-color:var(--green);color:#052419;font-weight:800}.status,.help{text-align:center}.status{min-height:24px;color:var(--muted);margin:12px 0 4px}.help{font-size:.88rem;color:#8190aa;margin:5px 0 0}.touchpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,42px);justify-content:center;gap:5px;margin:12px auto 0}.touchpad button{color:white;background:var(--light);border:1px solid var(--line);border-radius:9px;touch-action:manipulation}.touchpad [data-key=up]{grid-column:2}.touchpad [data-key=left]{grid-column:1;grid-row:2}.touchpad [data-key=down]{grid-column:2;grid-row:2}.touchpad [data-key=right]{grid-column:3;grid-row:2}footer{text-align:center;color:#8190aa;font-size:.82rem;margin:14px 0}@media(max-width:560px){body{padding:18px 10px 30px}.games{grid-template-columns:repeat(2,minmax(0,1fr))}.touchpad{display:grid}}
</style>
</head>
<body>
<main class="app">
<header><h1>Browser <span>Arcade</span></h1><p>Play directly in this page—no game embeds or extra downloads.</p></header>
<p class="label">Pick a game</p>
<nav class="games" aria-label="Game selection">
<button class="active" data-game="snake">🐍 Snake</button><button data-game="memory">🧠 Memory Match</button><button data-game="pong">🏓 Pong</button><button data-game="breakout">🧱 Breakout</button><button data-game="dodge">☄️ Meteor Dodge</button><button data-game="clicker">🎯 Target Rush</button><button data-game="maze">👻 Haunted Maze</button><button data-game="zombie">🧟 Zombie Survival</button><button data-game="space">🚀 Space Shooter</button><button data-game="platform">⚔️ Dungeon Runner</button>
</nav>
<section class="panel" aria-label="Game">
<div class="hud"><div class="title">Now playing: <span id="gameName">Snake</span></div><div class="score">Score: <span id="score">0</span></div></div>
<canvas id="board" width="640" height="480" aria-label="Game board"></canvas>
<div class="touchpad" aria-label="Touch controls"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
<div class="actions"><button class="control primary" id="start">Start game</button><button class="control" id="pause">Pause</button></div>
<p class="status" id="status" aria-live="polite">Choose a game and press Start.</p><p class="help" id="help"></p>
</section><footer>Original mini-games made with JavaScript and Canvas. If this page itself is blocked by a network, use it only where you have permission.</footer>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const $=id=>document.getElementById(id), scoreEl=$('score'),statusEl=$('status'),gameNameEl=$('gameName'),helpEl=$('help'),startBtn=$('start'),pauseBtn=$('pause');
const buttons=[...document.querySelectorAll('[data-game]')], names={snake:'Snake',memory:'Memory Match',pong:'Pong',breakout:'Breakout',dodge:'Meteor Dodge',clicker:'Target Rush',maze:'Haunted Maze',zombie:'Zombie Survival',space:'Space Shooter',platform:'Dungeon Runner'};
const instructions={snake:'Arrow keys / WASD or touch arrows. Eat food; avoid walls and yourself.',memory:'Click or tap cards to find all six matching pairs.',pong:'W/S or ↑/↓; drag on the board or use touch arrows. First to five wins.',breakout:'A/D or ←/→ to move the paddle. Keep the ball up and clear the bricks.',dodge:'A/D or ←/→ to dodge meteors. Collect green stars for bonus points.',clicker:'Tap/click the target quickly for 20 seconds.',maze:'Find three keys, then reach the exit. Arrow keys / WASD or touch controls. Avoid the ghost!',zombie:'Move with WASD/arrows. Aim with mouse/touch and click or press Space to shoot.',space:'Move with A/D or ←/→. Press Space or tap the board to fire.',platform:'A/D or ←/→ to move, Space/↑ to jump. Grab coins and reach the glowing exit.'};
let game='snake',data=null,running=false,paused=false,score=0,last=0,keys={};
const rand=(a,b)=>Math.random()*(b-a)+a,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function setScore(n){score=Math.floor(n);scoreEl.textContent=score}function finish(msg){running=false;paused=false;pauseBtn.textContent='Pause';statusEl.textContent=msg}
const mazeRows=['###############','#.............#','#.###.###.###.#','#...#.....#...#','###.#.###.#.###','#...#...#.#...#','#.#####.#.###.#','#.....#.#.....#','#.###.#.#####.#','#...#...#.....#','###.#####.###.#','#.............#','#.###.###.###.#','#.............#','###############'];
function fresh(g){
 if(g==='snake')return{snake:[{x:9,y:7},{x:8,y:7},{x:7,y:7}],dir:{x:1,y:0},next:{x:1,y:0},food:{x:14,y:8},timer:0};
 if(g==='memory'){let e=['🍒','🍋','🍉','🍇','🍊','🍓'];return{cards:[...e,...e].sort(()=>Math.random()-.5).map((emoji,i)=>({emoji,matched:false,id:i})),flipped:[],hideAt:0,moves:0}}
 if(g==='pong')return{py:190,ay:190,b:{x:320,y:240,vx:260,vy:130},p:0,a:0};
 if(g==='breakout'){let bricks=[];for(let r=0;r<5;r++)for(let c=0;c<10;c++)bricks.push({x:20+c*60,y:45+r*25,w:52,h:17,on:true,color:['#ff7185','#ff9f43','#ffd166','#45e0a1','#70a5ff'][r]});return{px:275,b:{x:320,y:360,vx:200,vy:-240},bricks,lives:3}}
 if(g==='dodge')return{px:320,things:[],spawn:0,time:0};
 if(g==='clicker')return{target:{x:320,y:230,r:28},time:20,hits:0};
 if(g==='maze')return{map:mazeRows.map(r=>r.split('')),p:{x:1,y:1},ghost:{x:13,y:1},keys:[{x:1,y:13},{x:7,y:11},{x:13,y:13}],got:0,ghostTimer:0};
 if(g==='zombie')return{player:{x:320,y:390,hp:3},zombies:[],bullets:[],spawn:0,fire:0,time:0,aim:{x:320,y:150}};
 if(g==='space')return{player:{x:320,y:420},enemies:[],bullets:[],spawn:0,fire:0,time:0,lives:3};
 return{player:{x:45,y:380,vx:0,vy:0},platforms:[{x:0,y:440,w:640,h:40},{x:130,y:365,w:110,h:16},{x:300,y:300,w:105,h:16},{x:470,y:230,w:120,h:16},{x:65,y:245,w:100,h:16}],coins:[{x:180,y:335},{x:350,y:270},{x:510,y:200},{x:100,y:215}],exit:{x:575,y:175,w:32,h:55},ground:false};
}
function select(g){game=g;running=false;paused=false;keys={};data=fresh(g);setScore(0);buttons.forEach(b=>b.classList.toggle('active',b.dataset.game===g));gameNameEl.textContent=names[g];helpEl.textContent=instructions[g];statusEl.textContent=`Ready to play ${names[g]}. Press Start game.`;startBtn.textContent='Start game';pauseBtn.textContent='Pause';draw()}
function start(){data=fresh(game);setScore(0);running=true;paused=false;last=performance.now();keys={};startBtn.textContent='Restart';pauseBtn.textContent='Pause';statusEl.textContent=game==='maze'?'Find the keys. Something is following you.':game==='zombie'?'Survive the zombie swarm!':'Game on!';}
function pause(){if(!running)return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';statusEl.textContent=paused?'Paused. Press Resume to continue.':'Game resumed.';last=performance.now()}
function cellOpen(x,y){return data.map[y]&&data.map[y][x]!== '#'}
function moveSnake(x,y){if(game!=='snake')return;let d=data.dir;if(x!==-d.x||y!==-d.y)data.next={x,y}}
function update(dt){if(!running||paused)return;
 if(game==='snake'){let s=data;s.timer+=dt;if(s.timer>=.12){s.timer=0;s.dir=s.next;let h={x:s.snake[0].x+s.dir.x,y:s.snake[0].y+s.dir.y},e=h.x===s.food.x&&h.y===s.food.y,body=e?s.snake:s.snake.slice(0,-1);if(h.x<0||h.x>=20||h.y<0||h.y>=15||body.some(p=>p.x===h.x&&p.y===h.y)){finish(`Game over! Score: ${score}.`);return}s.snake.unshift(h);if(e){setScore(score+10);do{s.food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*15)}}while(s.snake.some(p=>p.x===s.food.x&&p.y===s.food.y))}else s.snake.pop()}}
 if(game==='memory'&&data.hideAt&&performance.now()>data.hideAt){data.flipped=[];data.hideAt=0}
 if(game==='pong'){let s=data;if(keys.up)s.py-=330*dt;if(keys.down)s.py+=330*dt;s.py=clamp(s.py,0,380);s.ay=clamp(s.ay+(s.b.y-50-s.ay)*Math.min(1,dt*2.7),0,380);let b=s.b;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<9||b.y>471)b.vy*=-1;if(b.vx<0&&b.x<38&&b.y>s.py&&b.y<s.py+100){b.vx=Math.abs(b.vx)*1.04;b.vy+=(b.y-s.py-50)*2;b.x=39}if(b.vx>0&&b.x>602&&b.y>s.ay&&b.y<s.ay+100){b.vx=-Math.abs(b.vx)*1.02;b.vy+=(b.y-s.ay-50)*1.5;b.x=601}if(b.x<0){s.a++;b.x=320;b.y=240;b.vx=240;b.vy=rand(-170,170)}if(b.x>640){s.p++;setScore(s.p);b.x=320;b.y=240;b.vx=-240;b.vy=rand(-170,170)}if(s.p>=5||s.a>=5)finish(s.p>=5?'You win!':'Computer wins. Press Restart to play again.')}
 if(game==='breakout'){let s=data;if(keys.left)s.px-=380*dt;if(keys.right)s.px+=380*dt;s.px=clamp(s.px,0,550);let b=s.b;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<8||b.x>632)b.vx*=-1;if(b.y<8)b.vy=Math.abs(b.vy);if(b.vy>0&&b.y>409&&b.y<440&&b.x>s.px&&b.x<s.px+90){b.vy=-Math.abs(b.vy);b.vx+=(b.x-s.px-45)*2;b.y=408}for(let br of s.bricks){if(br.on&&b.x>br.x&&b.x<br.x+br.w&&b.y>br.y&&b.y<br.y+br.h){br.on=false;b.vy*=-1;setScore(score+10);break}}if(s.bricks.every(b=>!b.on)){finish('You cleared all the bricks!');return}if(b.y>490){if(--s.lives<=0){finish(`Out of lives! Score: ${score}.`);return}b.x=320;b.y=360;b.vy=-230;b.vx=rand(-170,170)}}
 if(game==='dodge'){let s=data;s.time+=dt;if(keys.left)s.px-=300*dt;if(keys.right)s.px+=300*dt;s.px=clamp(s.px,15,625);s.spawn-=dt;if(s.spawn<=0){let star=Math.random()<.2;s.things.push({x:rand(20,620),y:-15,r:star?10:17,v:rand(160,270)+s.time*2,star});s.spawn=Math.max(.22,.7-s.time*.008)}for(let i=s.things.length-1;i>=0;i--){let o=s.things[i];o.y+=o.v*dt;if(Math.hypot(o.x-s.px,o.y-420)<o.r+14){if(o.star){setScore(score+25);s.things.splice(i,1)}else{finish(`Meteor hit! Score: ${score}.`);return}}if(o.y>500)s.things.splice(i,1)}setScore(Math.floor(s.time*2));if(s.time>=30)finish(`You survived! Score: ${score}.`)}
 if(game==='clicker'){data.time-=dt;if(data.time<=0)finish(`Time's up! You hit the target ${data.hits} times.`)}
 if(game==='maze'){let s=data;s.ghostTimer+=dt;if(s.ghostTimer>.55){s.ghostTimer=0;let options=[[1,0],[-1,0],[0,1],[0,-1]].map(([x,y])=>({x:s.ghost.x+x,y:s.ghost.y+y})).filter(p=>cellOpen(p.x,p.y));options.sort((a,b)=>Math.abs(a.x-s.p.x)+Math.abs(a.y-s.p.y)-Math.abs(b.x-s.p.x)-Math.abs(b.y-s.p.y));if(options[0])s.ghost=options[0]}if(s.ghost.x===s.p.x&&s.ghost.y===s.p.y){finish('The ghost caught you! Press Restart to escape again.');return}if(s.got===3&&s.p.x===13&&s.p.y===13)finish(`You escaped the maze! Score: ${score}.`)}
 if(game==='zombie'){let s=data,p=s.player;s.time+=dt;if(keys.left)p.x-=190*dt;if(keys.right)p.x+=190*dt;if(keys.up)p.y-=190*dt;if(keys.down)p.y+=190*dt;p.x=clamp(p.x,15,625);p.y=clamp(p.y,15,465);s.spawn-=dt;s.fire-=dt;if(s.spawn<=0){s.zombies.push({x:Math.random()<.5?-10:650,y:rand(30,450),hp:2,speed:rand(38,60)+s.time});s.spawn=.95}for(let z of s.zombies){let dx=p.x-z.x,dy=p.y-z.y,d=Math.hypot(dx,dy)||1;z.x+=dx/d*z.speed*dt;z.y+=dy/d*z.speed*dt;if(d<24){z.x-=dx/d*60*dt;z.y-=dy/d*60*dt;if(!z.lastHit||performance.now()-z.lastHit>900){p.hp--;z.lastHit=performance.now();if(p.hp<=0){finish(`Overrun! Score: ${score}.`);return}}}}for(let i=s.bullets.length-1;i>=0;i--){let b=s.bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;let hit=s.zombies.findIndex(z=>Math.hypot(z.x-b.x,z.y-b.y)<19);if(hit>=0){s.zombies[hit].hp--;s.bullets.splice(i,1);if(s.zombies[hit].hp<=0){s.zombies.splice(hit,1);setScore(score+10)}}else if(b.x<0||b.x>640||b.y<0||b.y>480)s.bullets.splice(i,1)}setScore(Math.max(score,Math.floor(s.time*2)))}
 if(game==='space'){let s=data,p=s.player;s.time+=dt;if(keys.left)p.x-=300*dt;if(keys.right)p.x+=300*dt;p.x=clamp(p.x,18,622);s.fire-=dt;s.spawn-=dt;if(s.fire<=0&&keys.fire){s.bullets.push({x:p.x,y:p.y-18});s.fire=.18}if(s.spawn<=0){s.enemies.push({x:rand(20,620),y:-15,v:rand(70,140)});s.spawn=.65}for(let b of s.bullets)b.y-=440*dt;for(let e of s.enemies)e.y+=e.v*dt;for(let i=s.enemies.length-1;i>=0;i--){let e=s.enemies[i],bi=s.bullets.findIndex(b=>Math.hypot(b.x-e.x,b.y-e.y)<18);if(bi>=0){s.enemies.splice(i,1);s.bullets.splice(bi,1);setScore(score+10)}else if(e.y>500){s.enemies.splice(i,1);s.lives--;if(s.lives<=0){finish(`Ship destroyed! Score: ${score}.`);return}}}if(s.enemies.some(e=>Math.hypot(e.x-p.x,e.y-p.y)<23)){finish(`You were hit! Score: ${score}.`);return}}
 if(game==='platform'){let s=data,p=s.player;p.vx=(keys.left?-190:0)+(keys.right?190:0);p.x+=p.vx*dt;p.x=clamp(p.x,0,620);p.vy+=850*dt;let oldY=p.y;p.y+=p.vy*dt;s.ground=false;for(let q of s.platforms){if(p.vy>=0&&oldY+24<=q.y&&p.y+24>=q.y&&p.x+20>q.x&&p.x<q.x+q.w){p.y=q.y-24;p.vy=0;s.ground=true}}for(let i=s.coins.length-1;i>=0;i--)if(Math.hypot(p.x+10-s.coins[i].x,p.y+10-s.coins[i].y)<22){s.coins.splice(i,1);setScore(score+25)}if(p.y>510){finish(`Fell into the dungeon! Score: ${score}.`);return}if(p.x+20>s.exit.x&&p.x<s.exit.x+s.exit.w&&p.y+24>s.exit.y)finish(`Dungeon cleared! Final score: ${score}.`)}
}
function bg(){ctx.fillStyle='#080e1a';ctx.fillRect(0,0,W,H)}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){if(!data)return;bg();ctx.textAlign='left';ctx.textBaseline='alphabetic';
 if(game==='snake'){let z=32;ctx.strokeStyle='#18243a';for(let x=0;x<=20;x++){ctx.beginPath();ctx.moveTo(x*z,0);ctx.lineTo(x*z,H);ctx.stroke()}for(let y=0;y<=15;y++){ctx.beginPath();ctx.moveTo(0,y*z);ctx.lineTo(W,y*z);ctx.stroke()}circle((data.food.x+.5)*z,(data.food.y+.5)*z,11,'#ff7185');data.snake.forEach((p,i)=>{ctx.fillStyle=i?'#10b981':'#a7f3d0';ctx.beginPath();ctx.roundRect(p.x*z+2,p.y*z+2,28,28,6);ctx.fill()})}
 if(game==='memory'){let size=94,gap=15,left=34,top=32;data.cards.forEach((c,i)=>{let x=left+(i%6)*(size+gap),y=top+Math.floor(i/6)*(size+gap),face=c.matched||data.flipped.includes(i);ctx.fillStyle=c.matched?'#164638':face?'#202b43':'#142039';ctx.strokeStyle=c.matched?'#45e0a1':'#40516f';ctx.beginPath();ctx.roundRect(x,y,size,size,11);ctx.fill();ctx.stroke();ctx.fillStyle='white';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='40px system-ui';ctx.fillText(face?c.emoji:'?',x+size/2,y+size/2)})}
 if(game==='pong'){ctx.setLineDash([9,12]);ctx.strokeStyle='#35435d';ctx.beginPath();ctx.moveTo(320,0);ctx.lineTo(320,480);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#70a5ff';ctx.fillRect(18,data.py,12,100);ctx.fillStyle='#ff7185';ctx.fillRect(610,data.ay,12,100);circle(data.b.x,data.b.y,10,'white');ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 34px system-ui';ctx.fillText(`${data.p}     ${data.a}`,320,42)}
 if(game==='breakout'){data.bricks.forEach(b=>{if(b.on){ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill()}});ctx.fillStyle='#70a5ff';ctx.beginPath();ctx.roundRect(data.px,420,90,13,7);ctx.fill();circle(data.b.x,data.b.y,9,'white');ctx.fillStyle='#aab6ce';ctx.font='16px system-ui';ctx.fillText(`Lives: ${data.lives}`,12,466)}
 if(game==='dodge'){ctx.fillStyle='#70a5ff';ctx.beginPath();ctx.moveTo(data.px,397);ctx.lineTo(data.px-18,440);ctx.lineTo(data.px+18,440);ctx.fill();data.things.forEach(o=>circle(o.x,o.y,o.r,o.star?'#45e0a1':'#ff806b'));ctx.fillStyle='#aab6ce';ctx.font='16px system-ui';ctx.fillText(`Survive: ${Math.max(0,30-data.time).toFixed(1)}s`,12,25)}
 if(game==='clicker'){ctx.fillStyle='#aab6ce';ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillText(`Time: ${data.time.toFixed(1)}s`,320,42);circle(data.target.x,data.target.y,data.target.r,'#45e0a1');circle(data.target.x,data.target.y,data.target.r*.55,'#c9ffe8');circle(data.target.x,data.target.y,data.target.r*.22,'#45e0a1');ctx.font='16px system-ui';ctx.fillText(`Hits: ${data.hits}`,320,462)}
 if(game==='maze'){let size=32;data.map.forEach((row,y)=>row.forEach((c,x)=>{ctx.fillStyle=c==='#'?'#29354c':'#101a2d';ctx.fillRect(x*size,y*size,size-1,size-1)}));data.keys.forEach(k=>circle((k.x+.5)*size,(k.y+.5)*size,7,'#ffd166'));ctx.fillStyle=data.got===3?'#45e0a1':'#67758f';ctx.fillRect(13*size+7,13*size+7,18,18);circle((data.p.x+.5)*size,(data.p.y+.5)*size,11,'#70a5ff');circle((data.ghost.x+.5)*size,(data.ghost.y+.5)*size,11,'#ff7185');ctx.fillStyle='white';ctx.font='15px system-ui';ctx.fillText(`Keys: ${data.got}/3`,12,470)}
 if(game==='zombie'){let s=data;ctx.strokeStyle='#1d2940';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}s.bullets.forEach(b=>circle(b.x,b.y,4,'#ffd166'));s.zombies.forEach(z=>{circle(z.x,z.y,14,'#80b85a');circle(z.x-5,z.y-3,2,'#172318');circle(z.x+5,z.y-3,2,'#172318')});circle(s.player.x,s.player.y,13,'#70a5ff');ctx.fillStyle='#ff7185';ctx.font='16px system-ui';ctx.fillText(`Health: ${'♥'.repeat(s.player.hp)}`,12,25)}
 if(game==='space'){let s=data;ctx.fillStyle='#dce6ff';for(let i=0;i<35;i++)ctx.fillRect((i*97)%W,(i*71)%H,2,2);s.bullets.forEach(b=>ctx.fillStyle='#ffd166',ctx.fillRect(b.x-2,b.y-8,4,12));s.enemies.forEach(e=>{ctx.fillStyle='#ff7185';ctx.beginPath();ctx.moveTo(e.x,e.y-13);ctx.lineTo(e.x+13,e.y+12);ctx.lineTo(e.x-13,e.y+12);ctx.fill()});ctx.fillStyle='#70a5ff';ctx.beginPath();ctx.moveTo(s.player.x,s.player.y-17);ctx.lineTo(s.player.x-15,s.player.y+15);ctx.lineTo(s.player.x+15,s.player.y+15);ctx.fill();ctx.fillStyle='#aab6ce';ctx.font='16px system-ui';ctx.fillText(`Lives: ${s.lives}`,12,25)}
 if(game==='platform'){data.platforms.forEach(p=>{ctx.fillStyle='#62734e';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#374b3b';ctx.fillRect(p.x,p.y+7,p.w,p.h-7)});data.coins.forEach(c=>circle(c.x,c.y,8,'#ffd166'));ctx.fillStyle='#45e0a1';ctx.fillRect(data.exit.x,data.exit.y,data.exit.w,data.exit.h);ctx.fillStyle='#70a5ff';ctx.beginPath();ctx.roundRect(data.player.x,data.player.y,20,24,5);ctx.fill();ctx.fillStyle='white';ctx.font='16px system-ui';ctx.fillText('EXIT',data.exit.x-4,data.exit.y-8)}
}
function frame(now){let dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw();requestAnimationFrame(frame)}
function canvasPoint(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function shootAt(x,y){let s=data,p=s.player,dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy)||1;s.bullets.push({x:p.x,y:p.y,vx:dx/d*390,vy:dy/d*390})}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(game==='snake'&&dirs[k]){e.preventDefault();moveSnake(...dirs[k])}if(['arrowup','w'].includes(k))keys.up=true;if(['arrowdown','s'].includes(k))keys.down=true;if(['arrowleft','a'].includes(k))keys.left=true;if(['arrowright','d'].includes(k))keys.right=true;if(k===' '){e.preventDefault();if(game==='zombie'&&running){let a=data.aim;shootAt(a.x,a.y)}else if(game==='space')data.fire=-1,keys.fire=true;else if(game==='platform'&&data.ground)data.player.vy=-390;else pause()}if(game==='maze'&&dirs[k]){e.preventDefault();let [dx,dy]=dirs[k],p=data.p,nx=p.x+dx,ny=p.y+dy;if(cellOpen(nx,ny)){p.x=nx;p.y=ny;let i=data.keys.findIndex(q=>q.x===nx&&q.y===ny);if(i>=0){data.keys.splice(i,1);data.got++;setScore(score+50)}if(nx===13&&ny===13&&data.got<3)statusEl.textContent='The exit is locked—find all three keys!'}}});
document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['arrowup','w'].includes(k))keys.up=false;if(['arrowdown','s'].includes(k))keys.down=false;if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if(k===' ')keys.fire=false});
canvas.addEventListener('pointermove',e=>{let p=canvasPoint(e);if(game==='pong'&&running)data.py=clamp(p.y-50,0,380);if(game==='breakout'&&running)data.px=clamp(p.x-45,0,550);if(game==='zombie')data.aim=p});
canvas.addEventListener('pointerdown',e=>{let p=canvasPoint(e);if(game==='memory'&&running&&!data.hideAt){let size=94,gap=15,left=34,top=32;data.cards.forEach((c,i)=>{let x=left+(i%6)*(size+gap),y=top+Math.floor(i/6)*(size+gap);if(!c.matched&&!data.flipped.includes(i)&&p.x>=x&&p.x<x+size&&p.y>=y&&p.y<y+size){data.flipped.push(i);if(data.flipped.length===2){data.moves++;let[a,b]=data.flipped;if(data.cards[a].emoji===data.cards[b].emoji){data.cards[a].matched=data.cards[b].matched=true;data.flipped=[];setScore(score+25);if(data.cards.every(c=>c.matched))finish(`All pairs found in ${data.moves} moves!`)}else data.hideAt=performance.now()+700}}})}if(game==='clicker'&&running&&Math.hypot(p.x-data.target.x,p.y-data.target.y)<data.target.r){data.hits++;setScore(data.hits);data.target={x:rand(45,595),y:rand(75,410),r:Math.max(16,28-data.hits*.35)}}if(game==='zombie'&&running)shootAt(p.x,p.y);if(game==='space'&&running)keys.fire=true});canvas.addEventListener('pointerup',()=>{keys.fire=false});canvas.addEventListener('pointerleave',()=>{keys.fire=false});
document.querySelectorAll('.touchpad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();let k=b.dataset.key,d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};if(game==='snake')moveSnake(...d[k]);else if(game==='maze'){let[dx,dy]=d[k],x=data.p.x+dx,y=data.p.y+dy;if(cellOpen(x,y)){data.p={x,y};let i=data.keys.findIndex(q=>q.x===x&&q.y===y);if(i>=0){data.keys.splice(i,1);data.got++;setScore(score+50)}}}else keys[k]=true}));document.querySelectorAll('.touchpad button').forEach(b=>b.addEventListener('pointerup',()=>{keys[b.dataset.key]=false}));
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.game)));startBtn.addEventListener('click',start);pauseBtn.addEventListener('click',pause);select('snake');last=performance.now();requestAnimationFrame(frame);
})();
</script>
