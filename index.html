<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Arcade — Browser Games</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151d31;
      --panel-light: #202b43;
      --line: #33415d;
      --text: #f4f7ff;
      --muted: #aab6ce;
      --green: #45e0a1;
      --blue: #70a5ff;
      --gold: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px 48px;
      color: var(--text);
      background: radial-gradient(ellipse at top, #172746 0%, var(--bg) 62%);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .app { width: min(100%, 1020px); margin: 0 auto; }
    header { text-align: center; margin: 4px 0 24px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 4rem); letter-spacing: -.04em; }
    h1 span { color: var(--green); }
    .subtitle { color: var(--muted); margin: 8px 0 0; }
    .section-label { margin: 0 0 10px; color: var(--muted); font-size: .88rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .game-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 9px; margin-bottom: 16px; }
    button { font: inherit; }
    .game-choice, .control-button {
      border: 1px solid var(--line); border-radius: 12px; color: var(--text);
      background: var(--panel-light); padding: 11px 12px; cursor: pointer;
      transition: border-color .15s, transform .15s, background .15s;
    }
    .game-choice:hover, .control-button:hover { border-color: var(--green); transform: translateY(-1px); }
    .game-choice.active { border-color: var(--green); background: #193c3b; box-shadow: inset 0 0 0 1px #45e05533; }
    .panel { padding: clamp(12px, 3vw, 22px); border: 1px solid var(--line); border-radius: 20px; background: #151d31ed; box-shadow: 0 20px 55px #0005; }
    .hud { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .game-title { font-size: 1.1rem; font-weight: 750; }
    .score { color: var(--gold); font-weight: 750; }
    canvas { display: block; width: min(100%, 560px); aspect-ratio: 1; height: auto; margin: 0 auto; border: 1px solid var(--line); border-radius: 14px; background: #080e1a; touch-action: none; }
    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .control-button { min-width: 100px; }
    .control-button.primary { background: var(--green); border-color: var(--green); color: #052419; font-weight: 800; }
    .status { min-height: 24px; margin: 13px 0 0; color: var(--muted); text-align: center; }
    .help { margin: 7px 0 0; color: #8190aa; font-size: .88rem; text-align: center; }
    .mobile-controls { display: none; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 44px); justify-content: center; gap: 6px; margin-top: 14px; }
    .mobile-controls button { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-light); color: white; font-size: 1.15rem; touch-action: manipulation; }
    .mobile-controls [data-dir="up"] { grid-column: 2; }
    .mobile-controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .mobile-controls [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .mobile-controls [data-dir="right"] { grid-column: 3; grid-row: 2; }
    footer { margin-top: 16px; text-align: center; color: #8190aa; font-size: .82rem; }
    @media (max-width: 560px) { body { padding: 20px 10px 32px; } .game-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } .mobile-controls { display: grid; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Browser <span>Arcade</span></h1>
      <p class="subtitle">Six quick games, built right into this page. No downloads or game embeds.</p>
    </header>

    <p class="section-label">Choose a game</p>
    <nav class="game-list" aria-label="Choose a game">
      <button class="game-choice active" data-game="snake">🐍 Snake</button>
      <button class="game-choice" data-game="memory">🧠 Memory Match</button>
      <button class="game-choice" data-game="pong">🏓 Pong</button>
      <button class="game-choice" data-game="breakout">🧱 Breakout</button>
      <button class="game-choice" data-game="dodge">☄️ Meteor Dodge</button>
      <button class="game-choice" data-game="clicker">🎯 Target Rush</button>
    </nav>

    <section class="panel" aria-label="Game">
      <div class="hud">
        <div class="game-title">Now playing: <span id="gameName">Snake</span></div>
        <div class="score">Score: <span id="score">0</span></div>
      </div>
      <canvas id="gameCanvas" width="480" height="480" aria-label="Game board"></canvas>
      <div class="mobile-controls" id="mobileControls" aria-label="Touch direction controls">
        <button data-dir="up" aria-label="Move up">▲</button>
        <button data-dir="left" aria-label="Move left">◀</button>
        <button data-dir="down" aria-label="Move down">▼</button>
        <button data-dir="right" aria-label="Move right">▶</button>
      </div>
      <div class="actions">
        <button class="control-button primary" id="startBtn">Start game</button>
        <button class="control-button" id="pauseBtn">Pause</button>
      </div>
      <p class="status" id="statusText" aria-live="polite">Use arrow keys or WASD, then press Start.</p>
      <p class="help" id="helpText"></p>
    </section>
    <footer>Made with plain JavaScript and Canvas. Games run locally in your browser.</footer>
  </main>

  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const gameNameEl = document.getElementById('gameName');
      const statusEl = document.getElementById('statusText');
      const helpEl = document.getElementById('helpText');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const gameButtons = [...document.querySelectorAll('[data-game]')];
      const W = canvas.width, H = canvas.height;
      const names = { snake: 'Snake', memory: 'Memory Match', pong: 'Pong', breakout: 'Breakout', dodge: 'Meteor Dodge', clicker: 'Target Rush' };
      const help = {
        snake: 'Move: arrow keys / WASD or touch arrows. Don’t hit the walls or yourself.',
        memory: 'Tap or click two cards to find matching pairs. Match all six pairs.',
        pong: 'Move: W/S or ↑/↓. On touch screens, drag on the board to move your paddle.',
        breakout: 'Move: ←/→ or A/D. On touch screens, drag to move the paddle.',
        dodge: 'Move: ←/→ or A/D. Dodge meteors; collect green stars for bonus points.',
        clicker: 'Click or tap the target as many times as you can before time runs out.'
      };
      const state = { game: 'snake', started: false, paused: false, score: 0, lastTime: 0, accumulator: 0, data: null };
      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
      const setScore = value => { state.score = value; scoreEl.textContent = Math.floor(value); };
      const finish = message => { state.started = false; state.paused = false; pauseBtn.textContent = 'Pause'; statusEl.textContent = message; };

      function freshData(game) {
        if (game === 'snake') return { cells: 20, snake: [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}], dir: {x: 1, y: 0}, next: {x: 1, y: 0}, food: {x: 14, y: 10}, elapsed: 0 };
        if (game === 'memory') {
          const faces = ['🍒','🍋','🍉','🍇','🍊','🍓'];
          const deck = [...faces, ...faces].sort(() => Math.random() - .5);
          return { cards: deck.map((emoji, id) => ({emoji, id, matched: false})), flipped: [], mismatchAt: 0, moves: 0 };
        }
        if (game === 'pong') return { playerY: 200, aiY: 200, ball: {x: 240, y: 240, vx: 230, vy: 150}, player: 0, ai: 0, keys: {} };
        if (game === 'breakout') {
          const bricks = [];
          for (let row = 0; row < 5; row++) for (let col = 0; col < 8; col++) bricks.push({x: 32 + col * 52, y: 54 + row * 26, w: 44, h: 16, alive: true, color: ['#ff6b6b','#ff9f43','#ffd166','#45e0a1','#70a5ff'][row]});
          return { paddleX: 205, ball: {x: 240, y: 390, vx: 190, vy: -220}, bricks, lives: 3, keys: {} };
        }
        if (game === 'dodge') return { playerX: 240, objects: [], spawn: 0, elapsed: 0, keys: {} };
        return { target: {x: 240, y: 240, r: 27}, time: 20, hits: 0 };
      }

      function setGame(game) {
        state.game = game;
        state.started = false; state.paused = false; state.accumulator = 0;
        state.data = freshData(game); setScore(0);
        gameButtons.forEach(button => button.classList.toggle('active', button.dataset.game === game));
        gameNameEl.textContent = names[game];
        helpEl.textContent = help[game];
        statusEl.textContent = `Ready to play ${names[game]}. Press Start game.`;
        startBtn.textContent = 'Start game'; pauseBtn.textContent = 'Pause';
        draw();
      }

      function startGame() {
        if (state.game === 'snake' || state.game === 'memory' || state.game === 'pong' || state.game === 'breakout' || state.game === 'dodge' || state.game === 'clicker') {
          state.data = freshData(state.game); setScore(0);
        }
        state.started = true; state.paused = false; state.lastTime = performance.now(); state.accumulator = 0;
        startBtn.textContent = 'Restart'; pauseBtn.textContent = 'Pause';
        const messages = { snake: 'Go! Collect the glowing food.', memory: 'Find all six matching pairs.', pong: 'First to 5 points wins!', breakout: 'Clear the bricks. You have 3 lives.', dodge: 'Stay alive and collect green stars!', clicker: 'Go! Tap the target!' };
        statusEl.textContent = messages[state.game]; draw();
      }

      function togglePause() {
        if (!state.started) return;
        state.paused = !state.paused;
        pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
        statusEl.textContent = state.paused ? 'Paused. Press Resume to continue.' : 'Game resumed!';
        state.lastTime = performance.now();
      }

      function spawnFood() {
        const s = state.data;
        let p;
        do { p = {x: Math.floor(Math.random() * s.cells), y: Math.floor(Math.random() * s.cells)}; }
        while (s.snake.some(part => part.x === p.x && part.y === p.y));
        s.food = p;
      }

      function updateSnake(dt) {
        const s = state.data; s.elapsed += dt;
        if (s.elapsed < 0.115) return;
        s.elapsed = 0; s.dir = s.next;
        const head = {x: s.snake[0].x + s.dir.x, y: s.snake[0].y + s.dir.y};
        const eating = head.x === s.food.x && head.y === s.food.y;
        const body = eating ? s.snake : s.snake.slice(0, -1);
        if (head.x < 0 || head.x >= s.cells || head.y < 0 || head.y >= s.cells || body.some(p => p.x === head.x && p.y === head.y)) {
          finish(`Game over! Final score: ${state.score}. Press Restart to try again.`); return;
        }
        s.snake.unshift(head);
        if (eating) { setScore(state.score + 10); spawnFood(); } else s.snake.pop();
      }

      function updateMemory() {
        const s = state.data;
        if (s.mismatchAt && performance.now() >= s.mismatchAt) { s.flipped = []; s.mismatchAt = 0; }
      }

      function updatePong(dt) {
        const s = state.data;
        if (s.keys.up) s.playerY -= 330 * dt;
        if (s.keys.down) s.playerY += 330 * dt;
        s.playerY = clamp(s.playerY, 20, H - 100);
        s.aiY += (s.ball.y - 50 - s.aiY) * Math.min(1, dt * 3.1);
        s.aiY = clamp(s.aiY, 20, H - 100);
        const b = s.ball; b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.y < 10 || b.y > H - 10) b.vy *= -1;
        if (b.vx < 0 && b.x - 10 <= 30 && b.y >= s.playerY && b.y <= s.playerY + 100) { b.x = 40; b.vx = Math.abs(b.vx) * 1.04; b.vy += (b.y - (s.playerY + 50)) * 2.4; }
        if (b.vx > 0 && b.x + 10 >= W - 30 && b.y >= s.aiY && b.y <= s.aiY + 100) { b.x = W - 40; b.vx = -Math.abs(b.vx) * 1.02; b.vy += (b.y - (s.aiY + 50)) * 1.8; }
        if (b.x < -12) { s.ai++; b.x = W / 2; b.y = H / 2; b.vx = 220; b.vy = rand(-170, 170); }
        if (b.x > W + 12) { s.player++; setScore(s.player); b.x = W / 2; b.y = H / 2; b.vx = -220; b.vy = rand(-170, 170); }
        if (s.player >= 5 || s.ai >= 5) finish(s.player >= 5 ? 'You win! Press Restart for another match.' : 'Computer wins this round. Press Restart to play again.');
      }

      function updateBreakout(dt) {
        const s = state.data;
        if (s.keys.left) s.paddleX -= 370 * dt;
        if (s.keys.right) s.paddleX += 370 * dt;
        s.paddleX = clamp(s.paddleX, 10, W - 100);
        const b = s.ball; b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.x < 9 || b.x > W - 9) b.vx *= -1;
        if (b.y < 9) b.vy = Math.abs(b.vy);
        if (b.vy > 0 && b.y + 9 >= 420 && b.y < 440 && b.x >= s.paddleX && b.x <= s.paddleX + 90) {
          b.y = 410; b.vy = -Math.abs(b.vy); b.vx += ((b.x - (s.paddleX + 45)) / 45) * 100;
        }
        for (const brick of s.bricks) {
          if (brick.alive && b.x + 8 > brick.x && b.x - 8 < brick.x + brick.w && b.y + 8 > brick.y && b.y - 8 < brick.y + brick.h) {
            brick.alive = false; b.vy *= -1; setScore(state.score + 10); break;
          }
        }
        if (s.bricks.every(brick => !brick.alive)) { finish(`You cleared the wall! Score: ${state.score}.`); return; }
        if (b.y > H) {
          s.lives--;
          if (s.lives <= 0) { finish(`Out of lives! Final score: ${state.score}.`); return; }
          b.x = 240; b.y = 390; b.vx = rand(-160, 160); b.vy = -220;
          statusEl.textContent = `${s.lives} lives left. Keep going!`;
        }
      }

      function updateDodge(dt) {
        const s = state.data; s.elapsed += dt;
        if (s.keys.left) s.playerX -= 300 * dt;
        if (s.keys.right) s.playerX += 300 * dt;
        s.playerX = clamp(s.playerX, 18, W - 18);
        s.spawn -= dt;
        if (s.spawn <= 0) {
          const star = Math.random() < .18;
          s.objects.push({x: rand(20, W - 20), y: -15, r: star ? 10 : rand(12, 21), speed: rand(145, 260) + s.elapsed * 2, star});
          s.spawn = Math.max(.22, .72 - s.elapsed * .009);
        }
        for (let i = s.objects.length - 1; i >= 0; i--) {
          const o = s.objects[i]; o.y += o.speed * dt;
          const distance = Math.hypot(o.x - s.playerX, o.y - 420);
          if (distance < o.r + 15) {
            if (o.star) { setScore(state.score + 25); s.objects.splice(i, 1); continue; }
            finish(`Meteor hit! Final score: ${state.score}.`); return;
          }
          if (o.y > H + 25) s.objects.splice(i, 1);
        }
        if (s.elapsed >= 30) finish(`You survived! Final score: ${state.score}.`);
        else setScore(Math.floor(s.elapsed * 2));
      }

      function updateClicker(dt) {
        const s = state.data; s.time -= dt;
        if (s.time <= 0) { s.time = 0; finish(`Time's up! You scored ${s.hits} hits.`); }
      }

      function update(dt) {
        if (!state.started || state.paused) return;
        if (state.game === 'snake') updateSnake(dt);
        if (state.game === 'memory') updateMemory();
        if (state.game === 'pong') updatePong(dt);
        if (state.game === 'breakout') updateBreakout(dt);
        if (state.game === 'dodge') updateDodge(dt);
        if (state.game === 'clicker') updateClicker(dt);
      }

      function background() {
        ctx.fillStyle = '#080e1a'; ctx.fillRect(0, 0, W, H);
      }
      function drawSnake() {
        const s = state.data, size = W / s.cells; background();
        ctx.strokeStyle = '#18243a'; ctx.lineWidth = 1;
        for (let i = 0; i <= s.cells; i++) { ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(W, i * size); ctx.stroke(); }
        ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc((s.food.x + .5) * size, (s.food.y + .5) * size, size * .32, 0, Math.PI * 2); ctx.fill();
        s.snake.forEach((p, i) => { ctx.fillStyle = i ? '#10b981' : '#a7f3d0'; ctx.beginPath(); ctx.roundRect(p.x * size + 2, p.y * size + 2, size - 4, size - 4, 6); ctx.fill(); });
      }
      function drawMemory() {
        const s = state.data; background();
        const size = 94, gap = 16, left = 40, top = 40;
        s.cards.forEach((card, i) => {
          const x = left + (i % 4) * (size + gap), y = top + Math.floor(i / 4) * (size + gap);
          const face = card.matched || s.flipped.includes(i);
          ctx.fillStyle = card.matched ? '#164638' : face ? '#202b43' : '#142039';
          ctx.strokeStyle = card.matched ? '#45e0a1' : '#40516f'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(x, y, size, size, 12); ctx.fill(); ctx.stroke();
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '42px system-ui'; ctx.fillStyle = '#fff';
          ctx.fillText(face ? card.emoji : '?', x + size / 2, y + size / 2);
        });
        ctx.textAlign = 'left';
        if (!state.started) { ctx.fillStyle = '#aab6ce'; ctx.font = '15px system-ui'; ctx.fillText('Press Start game, then select cards', 112, 450); }
      }
      function drawPong() {
        const s = state.data; background(); ctx.setLineDash([9, 12]); ctx.strokeStyle = '#35435d'; ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#70a5ff'; ctx.fillRect(18, s.playerY, 12, 100); ctx.fillStyle = '#ff7185'; ctx.fillRect(W - 30, s.aiY, 12, 100);
        ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(s.ball.x, s.ball.y, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center'; ctx.fillText(`${s.player}     ${s.ai}`, W/2, 42);
      }
      function drawBreakout() {
        const s = state.data; background();
        s.bricks.forEach(brick => { if (!brick.alive) return; ctx.fillStyle = brick.color; ctx.beginPath(); ctx.roundRect(brick.x, brick.y, brick.w, brick.h, 4); ctx.fill(); });
        ctx.fillStyle = '#70a5ff'; ctx.beginPath(); ctx.roundRect(s.paddleX, 420, 90, 13, 7); ctx.fill();
        ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(s.ball.x, s.ball.y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#aab6ce'; ctx.font = '16px system-ui'; ctx.textAlign = 'left'; ctx.fillText(`Lives: ${s.lives}`, 16, 462);
      }
      function drawDodge() {
        const s = state.data; background();
        ctx.fillStyle = '#70a5ff'; ctx.beginPath(); ctx.moveTo(s.playerX, 396); ctx.lineTo(s.playerX - 18, 438); ctx.lineTo(s.playerX + 18, 438); ctx.closePath(); ctx.fill();
        s.objects.forEach(o => { ctx.fillStyle = o.star ? '#45e0a1' : '#ff806b'; ctx.beginPath(); if (o.star) { ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); } else { ctx.moveTo(o.x, o.y - o.r); ctx.lineTo(o.x + o.r, o.y + o.r); ctx.lineTo(o.x - o.r, o.y + o.r); ctx.closePath(); } ctx.fill(); });
        ctx.fillStyle = '#aab6ce'; ctx.font = '16px system-ui'; ctx.textAlign = 'left'; ctx.fillText(`Survive: ${Math.max(0, 30 - s.elapsed).toFixed(1)}s`, 16, 28);
      }
      function drawClicker() {
        const s = state.data; background();
        ctx.fillStyle = '#aab6ce'; ctx.font = 'bold 25px system-ui'; ctx.textAlign = 'center'; ctx.fillText(`Time: ${s.time.toFixed(1)}s`, W/2, 44);
        ctx.fillStyle = '#45e0a1'; ctx.beginPath(); ctx.arc(s.target.x, s.target.y, s.target.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#c9ffe8'; ctx.beginPath(); ctx.arc(s.target.x, s.target.y, s.target.r * .56, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#45e0a1'; ctx.beginPath(); ctx.arc(s.target.x, s.target.y, s.target.r * .22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#aab6ce'; ctx.font = '16px system-ui'; ctx.fillText(`Hits: ${s.hits}`, W/2, H - 24);
      }
      function draw() {
        if (!state.data) return;
        if (state.game === 'snake') drawSnake();
        if (state.game === 'memory') drawMemory();
        if (state.game === 'pong') drawPong();
        if (state.game === 'breakout') drawBreakout();
        if (state.game === 'dodge') drawDodge();
        if (state.game === 'clicker') drawClicker();
      }

      function frame(now) {
        const dt = Math.min((now - state.lastTime) / 1000 || 0, .05);
        state.lastTime = now;
        update(dt); draw();
        if (state.game === 'clicker' && state.started) statusEl.textContent = `Keep going! ${state.data.time.toFixed(1)} seconds left.`;
        requestAnimationFrame(frame);
      }
      function direction(x, y) {
        if (state.game !== 'snake' || !state.data) return;
        const d = state.data.dir;
        if (x !== -d.x || y !== -d.y) state.data.next = {x, y};
      }
      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return {x: (event.clientX - rect.left) * W / rect.width, y: (event.clientY - rect.top) * H / rect.height};
      }

      document.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        const directions = {arrowup: [0,-1], w: [0,-1], arrowdown: [0,1], s: [0,1], arrowleft: [-1,0], a: [-1,0], arrowright: [1,0], d: [1,0]};
        if (state.game === 'snake' && directions[key]) { event.preventDefault(); direction(...directions[key]); }
        const s = state.data;
        if (s && (state.game === 'pong' || state.game === 'breakout' || state.game === 'dodge')) {
          if (['arrowup','w'].includes(key) && state.game === 'pong') { s.keys.up = true; event.preventDefault(); }
          if (['arrowdown','s'].includes(key) && state.game === 'pong') { s.keys.down = true; event.preventDefault(); }
          if (['arrowleft','a'].includes(key)) { s.keys.left = true; event.preventDefault(); }
          if (['arrowright','d'].includes(key)) { s.keys.right = true; event.preventDefault(); }
        }
        if (event.code === 'Space') { event.preventDefault(); togglePause(); }
      });
      document.addEventListener('keyup', event => {
        const s = state.data; if (!s || !s.keys) return;
        const key = event.key.toLowerCase();
        if (['arrowup','w'].includes(key)) s.keys.up = false;
        if (['arrowdown','s'].includes(key)) s.keys.down = false;
        if (['arrowleft','a'].includes(key)) s.keys.left = false;
        if (['arrowright','d'].includes(key)) s.keys.right = false;
      });
      canvas.addEventListener('pointermove', event => {
        if (!state.started || state.paused) return;
        const p = point(event), s = state.data;
        if (state.game === 'pong') s.playerY = clamp(p.y - 50, 20, H - 100);
        if (state.game === 'breakout') s.paddleX = clamp(p.x - 45, 10, W - 100);
        if (state.game === 'dodge') s.playerX = clamp(p.x, 18, W - 18);
      });
      canvas.addEventListener('pointerdown', event => {
        if (!state.started || state.paused) return;
        const p = point(event), s = state.data;
        if (state.game === 'memory' && !s.mismatchAt) {
          const size = 94, gap = 16, left = 40, top = 40;
          s.cards.forEach((card, i) => {
            const x = left + (i % 4) * (size + gap), y = top + Math.floor(i / 4) * (size + gap);
            if (!card.matched && !s.flipped.includes(i) && p.x >= x && p.x <= x + size && p.y >= y && p.y <= y + size) {
              s.flipped.push(i); draw();
              if (s.flipped.length === 2) {
                s.moves++;
                const [a, b] = s.flipped;
                if (s.cards[a].emoji === s.cards[b].emoji) {
                  s.cards[a].matched = s.cards[b].matched = true; s.flipped = []; setScore(state.score + 25);
                  statusEl.textContent = 'Match! Keep going.';
                  if (s.cards.every(card => card.matched)) finish(`You matched every pair in ${s.moves} moves! Score: ${state.score}.`);
                } else { s.mismatchAt = performance.now() + 750; statusEl.textContent = 'Not a match — try another pair.'; }
              }
            }
          });
        }
        if (state.game === 'clicker') {
          const t = s.target;
          if (Math.hypot(p.x - t.x, p.y - t.y) <= t.r) {
            s.hits++; setScore(s.hits); t.x = rand(48, W - 48); t.y = rand(90, H - 55); t.r = Math.max(17, 29 - s.hits * .35);
          }
        }
      });
      document.querySelectorAll('.mobile-controls button').forEach(button => button.addEventListener('pointerdown', event => {
        event.preventDefault(); const dirs = {up: [0,-1], down: [0,1], left: [-1,0], right: [1,0]}; direction(...dirs[button.dataset.dir]);
      }));
      gameButtons.forEach(button => button.addEventListener('click', () => setGame(button.dataset.game)));
      startBtn.addEventListener('click', startGame);
      pauseBtn.addEventListener('click', togglePause);
      setGame('snake');
      requestAnimationFrame(now => { state.lastTime = now; requestAnimationFrame(frame); });
    })();
  </script>
</body>
</html>
