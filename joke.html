<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Random Joke Generator</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#1b2638;--line:#36465e;--text:#f4f7fb;--muted:#aab8ca;--accent:#67e8b1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#233754,var(--bg) 68%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,620px);text-align:center}.icon{font-size:3rem}h1{margin:8px 0;font-size:clamp(2rem,7vw,3rem)}p{color:var(--muted)}.card{margin:24px 0;padding:clamp(22px,6vw,42px);border:1px solid var(--line);border-radius:20px;background:#1b2638eF;box-shadow:0 20px 60px #0005}.joke{min-height:110px;display:grid;align-content:center;gap:14px;font-size:1.28rem;line-height:1.6}.setup{font-weight:700}.delivery{color:var(--accent)}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}button{border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:#2a3950;color:var(--text);font:inherit;font-weight:700;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);border-color:var(--accent);color:#08241a}.status{min-height:24px;font-size:.92rem}a{color:var(--accent)}footer{font-size:.82rem;color:#8291a7;margin-top:20px}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">😂</div>
    <h1>Random Joke Generator</h1>
    <p>Need a laugh? Get a fresh, family-friendly joke.</p>
    <section class="card" aria-label="Joke">
      <div class="joke" id="joke" aria-live="polite"><span>Press the button for a joke!</span></div>
      <div class="controls">
        <button class="primary" id="newJoke" type="button">Tell me a joke</button>
        <button id="copyJoke" type="button" disabled>Copy joke</button>
      </div>
    </section>
    <p class="status" id="status" aria-live="polite"></p>
    <footer>Jokes provided by <a href="https://icanhazdadjoke.com/" target="_blank" rel="noopener noreferrer">icanhazdadjoke.com</a>. Requires an internet connection.</footer>
  </main>
  <script>
    (() => {
      const jokeEl = document.getElementById('joke');
      const statusEl = document.getElementById('status');
      const newButton = document.getElementById('newJoke');
      const copyButton = document.getElementById('copyJoke');
      let currentJoke = '';

      async function getJoke() {
        newButton.disabled = true;
        copyButton.disabled = true;
        newButton.textContent = 'Loading…';
        statusEl.textContent = '';
        jokeEl.replaceChildren(Object.assign(document.createElement('span'), { textContent: 'Finding a joke…' }));
        try {
          const response = await fetch('https://icanhazdadjoke.com/', {
            headers: { Accept: 'application/json' },
            cache: 'no-store'
          });
          if (!response.ok) throw new Error(`Joke service returned ${response.status}`);
          const result = await response.json();
          if (typeof result.joke !== 'string' || !result.joke.trim()) throw new Error('The joke service returned an empty joke.');
          currentJoke = result.joke.trim();
          jokeEl.replaceChildren(Object.assign(document.createElement('span'), { textContent: currentJoke }));
          copyButton.disabled = false;
        } catch (error) {
          currentJoke = '';
          jokeEl.replaceChildren(Object.assign(document.createElement('span'), { textContent: 'Could not load a joke right now. Check your connection and try again.' }));
          statusEl.textContent = 'The joke API may be unavailable or blocked by your network.';
          console.error('Unable to fetch joke:', error);
        } finally {
          newButton.disabled = false;
          newButton.textContent = 'Tell me another';
        }
      }

      newButton.addEventListener('click', getJoke);
      copyButton.addEventListener('click', async () => {
        if (!currentJoke) return;
        try {
          await navigator.clipboard.writeText(currentJoke);
          statusEl.textContent = 'Joke copied!';
        } catch {
          statusEl.textContent = 'Clipboard access is unavailable in this browser.';
        }
      });
    })();
  </script>
</body>
</html>
